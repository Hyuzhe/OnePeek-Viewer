[package]
name = "onepeek-community"
version = "1.1.3"
description = "OnePeek Community — Open-source fast offline file viewer built with Tauri 2 & Rust"
authors = ["OnePeek Contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"

[lib]
name = "onepeek_community_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
percent-encoding = "2.3"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "deflate", "ppmd", "util"] }
rars = { version = "0.13", default-features = false }

[dev-dependencies]
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "compress", "deflate", "ppmd", "util"] }
rars = { version = "0.13", default-features = false, features = ["write"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
